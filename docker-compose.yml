services:
  playground:
    build:
      context: .
      args:
        WITH_WATERMARK_TOOLS: "1"
    image: flow2api-playground:local
    container_name: flow2api-playground
    ports:
      - "38001:8000"
    environment:
      # Engine generation — trỏ sang container/host flow2api đang chạy.
      FLOW2API_BASE_URL: ${FLOW2API_BASE_URL:-http://192.168.10.132:38000}
      # WM đã chuyển về flow2api gateway (per-token) — mặc định TẮT ở playground
      WATERMARK_ENABLED: ${WATERMARK_ENABLED:-0}
      WATERMARK_ENGINE: ${WATERMARK_ENGINE:-auto}
      WATERMARK_VIDEO_CROP_PERCENT: ${WATERMARK_VIDEO_CROP_PERCENT:-2}
      PLAYGROUND_MAX_RUNNING_JOBS: ${PLAYGROUND_MAX_RUNNING_JOBS:-3}
      # Reload code: uvicorn tự restart worker khi app/*.py đổi — sửa code xong
      # không cần docker restart. Đặt PLAYGROUND_RELOAD=0 trong .env để tắt.
      PLAYGROUND_RELOAD: ${PLAYGROUND_RELOAD:-1}
      # Video Studio Flow planner LLM — điền STUDIO_LLM_* trong .env để bật
      # (rỗng = engine mẫu nội bộ). Đổi .env xong phải `docker compose up -d`.
      STUDIO_LLM_BASE_URL: ${STUDIO_LLM_BASE_URL:-}
      STUDIO_LLM_API_KEY: ${STUDIO_LLM_API_KEY:-}
      STUDIO_LLM_MODEL: ${STUDIO_LLM_MODEL:-}
      STUDIO_LLM_TIMEOUT: ${STUDIO_LLM_TIMEOUT:-120}
      TORCH_HUB_CACHE: /root/.cache/torch/hub
    volumes:
      - ./data:/app/data
      - ./tmp:/app/tmp
      - ./masks:/app/masks
      - ./app:/app/app
      - ./static:/app/static
      - ./main.py:/app/main.py
      - ${TORCH_HUB_CACHE:-./data/torch/hub}:/root/.cache/torch/hub
    restart: unless-stopped
